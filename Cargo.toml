[workspace]
resolver = "2"
members = ["crates/core", "crates/devserver", "crates/web", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package.seat_core]
opt-level = 3
