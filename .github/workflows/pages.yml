# Publishes the web version on GitHub Pages on every push to main.
# Builds the same engine (seat_core) to WebAssembly, with threads, and the interface in web mode.
name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, with rust-src to build std with threads)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Engine to WebAssembly
        run: bash ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interface (web mode)
        working-directory: ui
        run: |
          npm ci
          BASE="/${{ github.event.repository.name }}/" npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
